# =============================================
# Application & Test Configuration
# =============================================

# Sample E-commerce Application URL
url=https://www.saucedemo.com/

# Browser configuration: chrome | firefox | edge
browser=chrome

# Run mode: local | headless | grid
runmode=local

# Grid hub URL (only used when runmode=grid)
gridUrl=http://localhost:4444/wd/hub

# =============================================
# Timeouts (in seconds)
# =============================================
implicitWait=10
explicitWait=20
pageLoadTimeout=30

# =============================================
# Test Data - Valid User
# =============================================
validUsername=standard_user
validPassword=secret_sauce

# =============================================
# Test Data - Locked-out User (negative test)
# =============================================
lockedUsername=locked_out_user
lockedPassword=secret_sauce

# =============================================
# Test Data - Invalid User
# =============================================
invalidUsername=invalid_user
invalidPassword=invalid_pass

# =============================================
# Checkout Test Data
# =============================================
firstName=John
lastName=Doe
postalCode=440001
